# ============================================================================
# dsh-control-bar — DSH bundle patch
# ============================================================================
# 把悬浮控制条挂进 Web profile 的配置树。
#
# 手工装到别的 profile：
#   dsh plugin --profile web add link:<本目录绝对路径>
# 装完重启 dsh web，再刷新浏览器。
# ============================================================================

- insert:
    - id: dsh-control-bar
      name: dsh-control-bar
